          <!-- Mobile Navbar Button -->

            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"

            <span class="navbar-toggler-icon"></span>

          </button>


          <div

            <ul class="navbar-nav ms-auto me-5 mb-2 mb-lg-0">

              <li class="nav-item">

      </nav>


      <!-- =========================
           CONTACT PAGE
      ========================= -->

      <section class="contact-page">

        <div class="container">

          <!-- Heading -->

          <div class="contact-heading">

            <h1>Contact Me</h1>

            <p>
              Have a project or idea? Let's work together.
            </p>

          </div>


          <!-- Contact Form -->

          <div class="row justify-content-center">

            <div class="col-lg-7 col-md-9">

              <div class="contact-form">

                <h2>GET IN TOUCH</h2>


                <form id="contactForm">

                  <!-- Full Name -->

                  <div class="form-group">

                    <label for="name">
                      Full Name
                    </label>

                    <input
                      type="text"
                      id="name"
                      class="form-control"
                      placeholder="Enter your full name"
                      required
                    />

                  </div>


                  <!-- Email -->

                  <div class="form-group">

                    <label for="email">
                      Email Address
                    </label>

                    <input
                      type="email"
                      id="email"
                      class="form-control"
                      placeholder="Enter your email"
                      required
                    />

                  </div>


                  <!-- Subject -->

                  <div class="form-group">

                    <label for="subject">
                      Subject
                    </label>

                    <input
                      type="text"
                      id="subject"
                      class="form-control"
                      placeholder="Enter subject"
                      required
                    />

                  </div>


                  <!-- Message -->

                  <div class="form-group">

                    <label for="message">
                      Message
                    </label>

                    <textarea
                      id="message"
                      class="form-control"
                      rows="6"
                      placeholder="Write your message..."
                      required
                    ></textarea>

                  </div>


                  <!-- Send Button -->

                  <button
                    type="submit"
                    class="send-btn"
                  >

                    <i class="bi bi-send"></i>

                    Send Message

                  </button>

                </form>

              </div>

            </div>

          </div>

        </div>

      </section>

    </section>


    <!-- Bootstrap JavaScript -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
